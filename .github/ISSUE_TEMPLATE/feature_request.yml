name: Feature request
description: Propose a focused improvement to the updater
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Small, auditable changes are preferred over broad feature bundles.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request belongs in the updater rather than the upstream domain-list project.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative designs.

  - type: dropdown
    id: platforms
    attributes:
      label: Affected platform
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - All platforms
        - Not platform-specific

  - type: textarea
    id: safety
    attributes:
      label: Safety / compatibility impact
      description: Does this affect Amnezia settings, scheduling, networking, privileges, or stored state?
