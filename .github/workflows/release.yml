name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          VERSION="$(grep -oE 'project\(amnezia_vpn_tunnel_update VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')"
          test -n "$VERSION"
          test "v$VERSION" = "$GITHUB_REF_NAME"
          grep -F "setApplicationVersion(QStringLiteral(\"$VERSION\"))" src/main.cpp

  build:
    name: Build release (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          cache: true

      - name: Install LinuxDeploy
        if: runner.os == 'Linux'
        id: linuxdeploy
        uses: miurahr/install-linuxdeploy-action@v1.8.0
        with:
          plugins: qt appimage

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate current upstream list
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          curl -fsSL "https://github.com/lib4u/amnezia-tunneling-ru/releases/download/latest/amnezia.json" -o upstream-amnezia.json
          ./build/amnezia-vpn-tunnel-update --validate-file upstream-amnezia.json

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ${{ steps.linuxdeploy.outputs.linuxdeploy }} \
            --plugin=qt \
            --output=appimage \
            --create-desktop-file \
            --executable=build/amnezia-vpn-tunnel-update \
            --appdir=AppDir \
            --icon-file=assets/amnezia-vpn-tunnel-update.svg
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*' | head -n 1)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" amnezia-vpn-tunnel-update-linux-x86_64.AppImage

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/amnezia-vpn-tunnel-update.exe package/
          windeployqt package/amnezia-vpn-tunnel-update.exe --release --no-translations --dir package
          Get-ChildItem package -Recurse -File |
            ForEach-Object { $_.FullName.Substring((Resolve-Path package).Path.Length + 1).Replace('\','/') } |
            Set-Content package/runtime.manifest
          Compress-Archive -Path package/* -DestinationPath amnezia-vpn-tunnel-update-windows-x64.zip

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          macdeployqt "build/amnezia-vpn-tunnel-update.app" -dmg
          mv "build/amnezia-vpn-tunnel-update.dmg" amnezia-vpn-tunnel-update-macos.dmg

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            amnezia-vpn-tunnel-update-*.zip
            amnezia-vpn-tunnel-update-*.dmg
            amnezia-vpn-tunnel-update-*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Amnezia VPN Tunnel Update $GITHUB_REF_NAME"
          fi
