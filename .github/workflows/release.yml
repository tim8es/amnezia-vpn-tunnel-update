name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/RELEASE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(tr -d '[:space:]' < .github/RELEASE)"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag in .github/RELEASE: $TAG" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

          if TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            SOURCE_SHA="$TAG_SHA"
            TAG_EXISTS=true
          else
            SOURCE_SHA="$GITHUB_SHA"
            TAG_EXISTS=false
          fi

          VERSION="$(git show "$SOURCE_SHA:CMakeLists.txt" | sed -n 's/^project(amnezia_vpn_tunnel_update VERSION \([0-9][0-9.]*\) LANGUAGES CXX)$/\1/p')"
          test -n "$VERSION"
          test "v$VERSION" = "$TAG"
          git show "$SOURCE_SHA:src/main.cpp" | grep -F "setApplicationVersion(QStringLiteral(\"$VERSION\"))"

          MARKER="$(git show "$SOURCE_SHA:.github/RELEASE" | tr -d '[:space:]')"
          test "$MARKER" = "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "Release source verified: $TAG @ $SOURCE_SHA"

  build:
    name: Build release (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          cache: true

      - name: Install LinuxDeploy
        if: runner.os == 'Linux'
        id: linuxdeploy
        uses: miurahr/install-linuxdeploy-action@v1.8.0
        with:
          plugins: qt appimage

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate built-in upstream lists
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for LIST in amnezia.json amnezia-ip-lite.json amnezia-ip.json; do
            curl -fsSL "https://github.com/lib4u/amnezia-tunneling-ru/releases/download/latest/$LIST" -o "$LIST"
            ./build/amnezia-vpn-tunnel-update --validate-file "$LIST"
          done

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ${{ steps.linuxdeploy.outputs.linuxdeploy }} \
            --plugin=qt \
            --output=appimage \
            --create-desktop-file \
            --executable=build/amnezia-vpn-tunnel-update \
            --appdir=AppDir \
            --icon-file=assets/amnezia-vpn-tunnel-update.svg
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*' | head -n 1)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" amnezia-vpn-tunnel-update-linux-x86_64.AppImage

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/amnezia-vpn-tunnel-update.exe package/
          windeployqt package/amnezia-vpn-tunnel-update.exe --release --no-translations --dir package
          Get-ChildItem package -Recurse -File |
            ForEach-Object { $_.FullName.Substring((Resolve-Path package).Path.Length + 1).Replace('\','/') } |
            Set-Content package/runtime.manifest
          Compress-Archive -Path package/* -DestinationPath amnezia-vpn-tunnel-update-windows-x64.zip

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          macdeployqt "build/amnezia-vpn-tunnel-update.app" -dmg
          mv "build/amnezia-vpn-tunnel-update.dmg" amnezia-vpn-tunnel-update-macos.dmg

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            amnezia-vpn-tunnel-update-*.zip
            amnezia-vpn-tunnel-update-*.dmg
            amnezia-vpn-tunnel-update-*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      TAG_EXISTS: ${{ needs.preflight.outputs.tag_exists }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release tag if needed
        if: needs.preflight.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SOURCE_SHA"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Amnezia VPN Tunnel Update $TAG"
